name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yaml'
      - 'docker-compose.prod.yaml'

jobs:
  backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create .env.backend
        run: |
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}" >> ./.env.backend
          echo "MONGO_URL=${{ secrets.MONGO_URL }}" >> ./.env.backend

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Backend Image
        run: docker build -t ankurdwivedi/expensetracker-backend:latest ./backend

      - name: Push Backend Image
        run: docker push ankurdwivedi/expensetracker-backend:latest


  frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create .env.frontend
        run: |
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" > ./.env.frontend

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Frontend Image
        run: docker build -t ankurdwivedi/expensetracker-frontend --build-arg REACT_APP_API_URL=http://localhost:4000/api ./frontend

      - name: Push Frontend Image
        run: docker push ankurdwivedi/expensetracker-frontend:latest


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # 🔥 Wait for both images to be pushed
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: SSH & Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd expense-tracker
            git pull origin main
            docker pull ankurdwivedi/expensetracker-backend:latest
            docker pull ankurdwivedi/expensetracker-frontend:latest
            docker-compose -f docker-compose.prod.yaml down
            docker-compose -f docker-compose.prod.yaml up -d --force-recreate --remove-orphans
